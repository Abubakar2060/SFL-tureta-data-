name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Repair MainActivity Kotlin
        run: |
          FILE=$(find extracted -name MainActivity.kt | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "Repairing: $FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()

          fixed = []

          for line in lines:

              # Fix broken Password OutlinedTextField
              if "OutlinedTextField(password," in line:
                  fixed.append(
                      '        OutlinedTextField(password,{password=it},label={Text("Password")},modifier=Modifier.fillMaxWidth())'
                  )
                  continue

              # Fix accidental lowercase modifier
              line = line.replace("modifier.clickable", "Modifier.clickable")

              # Fix illegal weight usage inside Quick/ServiceCard
              line = re.sub(
                  r'Modifier\.weight\(1f\)\.clickable\s*\{\s*onClick\(\)\s*\}',
                  'Modifier.clickable { onClick() }',
                  line
              )

              fixed.append(line)

          p.write_text("\n".join(fixed) + "\n")

          print("MainActivity.kt repaired successfully")
          PY

      - name: Show repaired lines
        run: |
          FILE=$(find extracted -name MainActivity.kt | head -1)

          echo "===== MainActivity.kt relevant lines ====="
          nl -ba "$FILE" | sed -n '100,145p'
          echo "=========================================="

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Project
        id: android
        run: |
          SETTINGS=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Find App Gradle
        id: app
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE=$(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          echo "Gradle file: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Configure Java 17
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE="${{ steps.app.outputs.file }}"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if p.suffix == ".kts":

              if "jvmToolchain(17)" not in s:
                  s += """

          kotlin {
              jvmToolchain(17)
          }
          """

              if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
                  s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          p.write_text(s)
          PY

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
