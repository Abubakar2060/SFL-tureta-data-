name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT: $PROJECT_DIR"

      - name: Inspect MainActivity
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          MAIN=$(find "$PROJECT_DIR" -type f -name "MainActivity.kt" | head -n 1)

          echo "===== MAIN ACTIVITY ====="
          echo "$MAIN"

          echo "===== LINES 95-145 ====="
          nl -ba "$MAIN" | sed -n '95,145p'

          echo "===== LOGIN SCREEN ====="
          grep -n -A45 -B5 "LoginScreen" "$MAIN" || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          

        gradle wrapper --gradle-version 8.9


            echo "===== FIX JVM TARGET ====="

            cat > /tmp/fix-jvm.gradle <<'EOF'
allprojects {
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }

    tasks.matching {
        it.name.startsWith("compile") && it.name.endsWith("Kotlin")
    }.configureEach {
        try {
            kotlinOptions.jvmTarget = "17"
        } catch (Exception ignored) {
        }
    }
}
EOF

            ./gradlew \
              --no-daemon \
              -Dorg.gradle.jvmargs="-Xmx3g" \
              -I /tmp/fix-jvm.gradle \
              assembleDebug
python3 - <<'PY'
from pathlib import Path

settings = list(Path(".").rglob("settings.gradle.kts")) + list(Path(".").rglob("settings.gradle"))

if not settings:
    raise SystemExit("settings.gradle not found")

project = settings[0].parent
gradle_file = project / "app" / "build.gradle.kts"

if not gradle_file.exists():
    raise SystemExit(f"Missing: {gradle_file}")

text = gradle_file.read_text()

if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
    marker = "android {"
    if marker not in text:
        raise SystemExit("android block not found")

    replacement = """android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
"""
    text = text.replace(marker, replacement, 1)

if 'kotlinOptions.jvmTarget = "17"' not in text:
    marker = "android {"
    insert = """android {
    kotlinOptions {
        jvmTarget = "17"
    }
"""
    text = text.replace(marker, insert, 1)

gradle_file.write_text(text)

print("===== UPDATED BUILD.GRADLE.KTS =====")
print(gradle_file.read_text())
PY

./gradlew \
  --no-daemon \
  -Dorg.gradle.jvmargs="-Xmx3g" \
  assembleDebug

        
            
          
            

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: extracted/**/*.apk
          if-no-files-found: error
