name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -Pkotlin.jvm.target.validation.mode=warning \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: extracted/**/*.apk
          if-no-files-found: error
