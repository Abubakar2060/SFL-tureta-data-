name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V11 ZIP
        run: |
          unzip -q SFL_TURETA_DATA_APP_V11_Production_Security.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: android
        run: |
          ANDROID_DIR=$(dirname "$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          if [ -z "$ANDROID_DIR" ] || [ "$ANDROID_DIR" = "." ]; then
            echo "No Android Gradle project found"
            exit 1
          fi
          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $ANDROID_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-debug-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
