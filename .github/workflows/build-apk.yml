name: Show SFL Gradle Config

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract and show Gradle
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          echo "ZIP: $ZIP"

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          PROJECT_DIR=$(dirname "$SETTINGS")

          APP_GRADLE=$(find "$PROJECT_DIR" -type f \( -path "*/app/build.gradle.kts" -o -path "*/app/build.gradle" \) | head -n 1)

          echo "PROJECT: $PROJECT_DIR"
          echo "GRADLE: $APP_GRADLE"

          echo "===== APP GRADLE ====="
          cat "$APP_GRADLE"
          echo "===== END ====="

          {
            echo "# SFL TURETA DATA Gradle Configuration"
            echo
            echo '```'
            cat "$APP_GRADLE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
