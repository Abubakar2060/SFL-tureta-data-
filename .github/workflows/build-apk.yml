name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT: $PROJECT_DIR"

      - name: Fix Android Kotlin source
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          MAIN=$(find "$PROJECT_DIR" -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity: $MAIN"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()

          # Ensure delegated-state imports exist.
          if "import androidx.compose.runtime.getValue" not in text:
              text = text.replace(
                  "import androidx.compose.runtime.*",
                  "import androidx.compose.runtime.*\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.setValue"
              )

          # If wildcard runtime import is not used, add imports after package line.
          if "import androidx.compose.runtime.getValue" not in text:
              lines = text.splitlines()
              package_index = -1
              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      package_index = i
                      break

              if package_index >= 0:
                  lines.insert(package_index + 1, "import androidx.compose.runtime.getValue")
                  lines.insert(package_index + 2, "import androidx.compose.runtime.setValue")
                  text = "\n".join(lines) + "\n"

          lines = text.splitlines()

          # Locate LoginScreen and ensure password state exists inside it.
          login_index = None
          brace_index = None

          for i, line in enumerate(lines):
              if "fun LoginScreen" in line:
                  login_index = i
                  break

          if login_index is not None:
              depth = 0
              found_open = False

              for i in range(login_index, len(lines)):
                  depth += lines[i].count("{")
                  if "{" in lines[i]:
                      found_open = True

                  if found_open and i > login_index:
                      if depth > 0:
                          # Insert after the first opening brace.
                          if not any("var password by remember" in x for x in lines[login_index:i+1]):
                              lines.insert(
                                  i + 1,
                                  '    var password by remember { mutableStateOf("") }'
                              )
                          break

          # Replace malformed password OutlinedTextField lines.
          fixed = []

          for line in lines:
              stripped = line.strip()

              if "OutlinedTextField" in line and "password" in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  fixed.append(
                      indent +
                      'OutlinedTextField('
                      'value = password, '
                      'onValueChange = { password = it }, '
                      'label = { Text("Password") }, '
                      'modifier = Modifier.fillMaxWidth()'
                      ')'
                  )
              else:
                  fixed.append(line)

          p.write_text("\n".join(fixed) + "\n")

          print("MainActivity.kt password section patched.")
          PY

          echo "===== PASSWORD REFERENCES ====="
          grep -n "password" "$MAIN" || true

      - name: Fix Gradle JVM target
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          APP_GRADLE=$(find "$PROJECT_DIR" -type f -name "build.gradle.kts" | grep "/app/" | head -n 1)

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          fi

          echo "App Gradle file: $APP_GRADLE"

          python3 - "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()

          if "kotlinOptions" not in text and "compilerOptions" not in text:
              text += '''

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(text)
          print("Gradle JVM configuration patched.")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: extracted/**/*.apk
          if-no-files-found: error
