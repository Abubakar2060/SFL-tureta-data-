      - name: Configure Java 17
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          APP_GRADLE="${{ steps.app.outputs.file }}"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s += """

          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          print("Java and Kotlin JVM target set to 17")
          PY

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-debug-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
