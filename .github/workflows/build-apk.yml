name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app ZIP
        run: |
          unzip -q SFL_TURETA_DATA_APP_V11_Production_Security.zip -d extracted

      - name: Show MainActivity problem
        run: |
          FILE=$(find extracted -type f -name "MainActivity.kt" | head -n 1)
          echo "FILE=$FILE"
          echo "=== LINES 100-140 ==="
          sed -n '100,140p' "$FILE"
