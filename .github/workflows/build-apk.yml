name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q SFL_TURETA_DATA_APP_V11_Production_Security.zip -d extracted

      - name: Fix MainActivity
        run: |
          FILE=$(find extracted -name MainActivity.kt | head -1)

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          s = p.read_text()

          # Replace broken password field line
          lines = s.splitlines()

          for i, line in enumerate(lines):
              if "OutlinedTextField(password" in line:
                  lines[i] = '           OutlinedTextField(password,{password=it},label={Text("Password")},modifier=Modifier.fillMaxWidth())'
                  print("Password line replaced")
                  break

          s = "\n".join(lines) + "\n"

          # Fix Quick composable
          s = s.replace(
              'Card(Modifier.weight(1f).clickable{onClick()})',
              'Card(modifier.clickable{onClick()})'
          )

          s = s.replace(
              '@Composable fun Quick(icon:String,title:String,onClick:()->Unit)',
              '@Composable fun Quick(icon:String,title:String,onClick:()->Unit,modifier:Modifier=Modifier)'
          )

          # Fix ServiceCard
          s = s.replace(
              '@Composable fun ServiceCard(s:Service,onClick:()->Unit)',
              '@Composable fun ServiceCard(s:Service,onClick:()->Unit,modifier:Modifier=Modifier)'
          )

          # Add modifier weight to cards
          s = s.replace(
              'Quick("📱","Data",onServices)',
              'Quick("📱","Data",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'Quick("💳","Airtime",onServices)',
              'Quick("💳","Airtime",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'Quick("💡","Bills",onServices)',
              'Quick("💡","Bills",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'Quick("🎓","Education",onServices)',
              'Quick("🎓","Education",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'ServiceCard(s,onServices)',
              'ServiceCard(s,onServices,Modifier.weight(1f))'
          )

          p.write_text(s)
          print("MainActivity fixed")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: android
        run: |
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Find app Gradle
        id: app
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE=$(find . -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Configure Java 17
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE="${{ steps.app.outputs.file }}"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if p.suffix == ".kts":
              s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          """
          else:
              s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
