name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app ZIP
        run: |
          unzip -q SFL_TURETA_DATA_APP_V11_Production_Security.zip -d extracted

      - name: Patch MainActivity
        run: |
          FILE=$(find extracted -type f -name "MainActivity.kt" | head -n 1)

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          pattern = r'OutlinedTextField\(password,\{.*?\},modifier=Modifier\.fillMaxWidth\(\)\)'
          replacement = 'OutlinedTextField(password,{password=it},label={Text("Password")},modifier=Modifier.fillMaxWidth())'
          s, count = re.subn(pattern, replacement, s, count=1)

          old = '@Composable fun Quick(icon:String,title:String,onClick:()->Unit){Card(Modifier.weight(1f).clickable{onClick()})'
          new = '@Composable fun Quick(icon:String,title:String,onClick:()->Unit,modifier:Modifier=Modifier){Card(modifier.clickable{onClick()})'
          s = s.replace(old, new, 1)

          old = '@Composable fun ServiceCard(s:Service,onClick:()->Unit){Card(Modifier.weight(1f).clickable{onClick()})'
          new = '@Composable fun ServiceCard(s:Service,onClick:()->Unit,modifier:Modifier=Modifier){Card(modifier.clickable{onClick()})'
          s = s.replace(old, new, 1)

          for icon, title in [
              ("📱", "Data"),
              ("💳", "Airtime"),
              ("💡", "Bills"),
              ("🎓", "Education"),
          ]:
              s = s.replace(
                  f'Quick("{icon}","{title}",onServices)',
                  f'Quick("{icon}","{title}",onServices,Modifier.weight(1f))'
              )

          s = s.replace(
              'ServiceCard(s,onServices)',
              'ServiceCard(s,onServices,Modifier.weight(1f))'
          )

          p.write_text(s)
          print("MainActivity fixed")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: android
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          ANDROID_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Find app Gradle file
        id: app
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          APP_GRADLE=$(find . -type f \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) | head -n 1)
          echo "file=$APP_GRADLE" >> "$GITHUB_OUTPUT"

      - name: Configure Android Java 17
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          APP_GRADLE="${{ steps.app.outputs.file }}"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if p.suffix == ".kts":
              s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          """
          else:
              s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)
          print("Java/Kotlin 17 configured")
          PY

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-debug-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
