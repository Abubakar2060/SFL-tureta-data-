name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT: $PROJECT_DIR"

      - name: Fix MainActivity Kotlin errors
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          MAIN=$(find "$PROJECT_DIR" -type f -name "MainActivity.kt" | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            exit 1
          fi

          echo "MainActivity: $MAIN"

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          lines = p.read_text().splitlines()

          fixed = []

          for line in lines:
              if "OutlinedTextField" in line and "password" in line:
                  fixed.append(
                      '    OutlinedTextField(value = password, onValueChange = { password = it }, label = { Text("Password") }, modifier = Modifier.fillMaxWidth())'
                  )
              elif "weight(1f)" in line:
                  fixed.append(line.replace(".weight(1f)", ""))
              else:
                  fixed.append(line)

          p.write_text("\n".join(fixed) + "\n")

          print("MainActivity.kt patched successfully.")
          PY

          echo "===== PASSWORD LINES ====="
          grep -n "password" "$MAIN" || true

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -Pkotlin.jvm.target.validation.mode=warning \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: extracted/**/*.apk
          if-no-files-found: error
