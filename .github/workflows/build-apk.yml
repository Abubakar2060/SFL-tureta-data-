name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q SFL_TURETA_DATA_APP_V11_Production_Security.zip -d extracted

      - name: Fix MainActivity Kotlin
        run: |
          FILE=$(find extracted -name MainActivity.kt | head -1)
          echo "MainActivity: $FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          s = p.read_text()

          # Replace the entire broken LoginScreen function
          start = s.find("@Composable\nfun LoginScreen")
          if start == -1:
              start = s.find("@Composable fun LoginScreen")

          if start == -1:
              raise SystemExit("ERROR: LoginScreen not found")

          next_comp = s.find("@Composable", start + 20)

          if next_comp == -1:
              raise SystemExit("ERROR: Next Composable not found")

          new_login = r'''@Composable
          fun LoginScreen(
              onLoggedIn: (String, String) -> Unit,
              onRegister: () -> Unit,
              onForgot: () -> Unit
          ) {
              var identifier by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var msg by remember { mutableStateOf("") }
              val scope = rememberCoroutineScope()

              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(Modifier.height(30.dp))

                  Text(
                      "SFL TURETA DATA",
                      style = MaterialTheme.typography.headlineMedium,
                      fontWeight = FontWeight.Bold
                  )

                  Text("Data cikin sauƙi, a kowane lokaci.")

                  OutlinedTextField(
                      value = identifier,
                      onValueChange = { identifier = it },
                      label = { Text("Phone Number / Email") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  OutlinedTextField(
                      value = password,
                      onValueChange = { password = it },
                      label = { Text("Password") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  Button(
                      onClick = {
                          scope.launch {
                              ApiClient.post(
                                  "/auth/login",
                                  JSONObject().apply {
                                      put("login", identifier)
                                      put("password", password)
                                  }.toString()
                              ).onSuccess { r ->
                                  val j = JSONObject(r)
                                  val d = j.optJSONObject("data")

                                  onLoggedIn(
                                      d?.optString("access_token").orEmpty(),
                                      d?.optJSONObject("user")
                                          ?.optString("full_name")
                                          .orEmpty()
                                  )
                              }.onFailure {
                                  msg = it.message ?: "Login failed"
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Login")
                  }

                  TextButton(onClick = onForgot) {
                      Text("Forgot Password?")
                  }

                  OutlinedButton(
                      onClick = onRegister,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Create Account")
                  }

                  if (msg.isNotBlank()) {
                      Text(msg)
                  }
              }
          }

          '''

          s = s[:start] + new_login + s[next_comp:]

          # Fix Quick function so weight is supplied by the parent Row
          s = s.replace(
              'Card(Modifier.weight(1f).clickable{onClick()})',
              'Card(modifier.clickable{onClick()})'
          )

          s = s.replace(
              '@Composable fun Quick(icon:String,title:String,onClick:()->Unit)',
              '@Composable fun Quick(icon:String,title:String,onClick:()->Unit,modifier:Modifier=Modifier)'
          )

          # Fix ServiceCard function
          s = s.replace(
              '@Composable fun ServiceCard(s:Service,onClick:()->Unit)',
              '@Composable fun ServiceCard(s:Service,onClick:()->Unit,modifier:Modifier=Modifier)'
          )

          # Pass weight from the HomeScreen rows
          s = s.replace(
              'Quick("📱","Data",onServices)',
              'Quick("📱","Data",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'Quick("💳","Airtime",onServices)',
              'Quick("💳","Airtime",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'Quick("💡","Bills",onServices)',
              'Quick("💡","Bills",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'Quick("🎓","Education",onServices)',
              'Quick("🎓","Education",onServices,Modifier.weight(1f))'
          )

          s = s.replace(
              'ServiceCard(s,onServices)',
              'ServiceCard(s,onServices,Modifier.weight(1f))'
          )

          p.write_text(s)
          print("MainActivity repaired successfully")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: android
        run: |
          SETTINGS=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Find app Gradle
        id: app
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE=$(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: app Gradle file not found"
            exit 1
          fi

          echo "App Gradle: $FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Configure Java 17
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE="${{ steps.app.outputs.file }}"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if p.suffix == ".kts":
              if "jvmToolchain(17)" not in s:
                  s += """

          kotlin {
              jvmToolchain(17)
          }
          """

              if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
                  s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          else:
              s += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)
          print("Java/Kotlin 17 configured")
          PY

      - name: Build APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Check APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
