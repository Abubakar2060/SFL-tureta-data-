name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT: $PROJECT_DIR"

      - name: Inspect MainActivity
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          MAIN=$(find "$PROJECT_DIR" -type f -name "MainActivity.kt" | head -n 1)

          echo "===== MAIN ACTIVITY ====="
          echo "$MAIN"

          echo "===== LINES 95-145 ====="
          nl -ba "$MAIN" | sed -n '95,145p'

      - name: Build APK
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS")

          cd "$PROJECT_DIR"

          echo "===== PROJECT ====="
          pwd

          echo "===== FIX JVM TARGET ====="

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")

          if not gradle_file.exists():
              raise SystemExit("app/build.gradle.kts not found")

          text = gradle_file.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          gradle_file.write_text(text)

          print("===== UPDATED BUILD FILE =====")
          print(gradle_file.read_text())
          PY

          echo "===== GRADLE VERSION ====="
          gradle --version

          echo "===== CREATE GRADLE WRAPPER ====="
          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          echo "===== BUILD APK ====="

          ./gradlew \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: extracted/**/*.apk
          if-no-files-found: error
