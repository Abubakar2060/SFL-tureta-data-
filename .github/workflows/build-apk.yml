name: Build SFL TURETA DATA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -q SFL_TURETA_DATA_APP_V11_Production_Security.zip -d extracted

      - name: Repair MainActivity
        run: |
          FILE=$(find extracted -name MainActivity.kt | head -1)
          echo "FILE=$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              'Card(Modifier.weight(1f).clickable{onClick()})',
              'Card(modifier.clickable{onClick()})'
          )

          s = s.replace(
              'Modifier.weight(1f).clickable',
              'modifier.clickable'
          )

          s = s.replace(
              'weight(1f)',
              'weight(1f)'
          )

          p.write_text(s)

          print("Weight fix applied")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: android
        run: |
          SETTINGS=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Find App Gradle
        id: app
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE=$(find . \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) | head -1)

          if [ -z "$FILE" ]; then
            echo "ERROR: app Gradle not found"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Configure Java 17
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          FILE="${{ steps.app.outputs.file }}"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if p.suffix == ".kts":
              if "jvmToolchain(17)" not in s:
                  s += """

          kotlin {
              jvmToolchain(17)
          }
          """

              if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
                  s += """

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFL-TURETA-DATA-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
